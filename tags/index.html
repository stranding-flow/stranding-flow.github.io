  <script>
    (function() {
      const toggle = document.querySelector('.theme-toggle');
      const body = document.body;
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        body.classList.add('dark');
      }
      toggle.addEventListener('click', function() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          body.classList.toggle('dark');
          localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
          return;
        }
        if (!('startViewTransition' in document)) {
          body.classList.toggle('dark');
          localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
          return;
        }
        var root = document.documentElement;
        var currentFrom = getComputedStyle(root).getPropertyValue('--from').trim();
        if (currentFrom === '0 0 0 100%') {
          root.style.setProperty('--from', '0 100% 0 0');
        } else {
          root.style.setProperty('--from', '0 0 0 100%');
        }
        root.style.setProperty('view-transition-name', 'animation-theme-toggle');
        var transition = document.startViewTransition(() => {
          body.classList.toggle('dark');
          localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        });
        transition.finished.then(() => {
          root.style.removeProperty('view-transition-name');
        });
      });

      
      const topBtn = document.createElement('button');
      topBtn.className = 'back-to-top';
      topBtn.setAttribute('aria-label', '回到顶部');
      topBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>';
      document.body.appendChild(topBtn);

      window.addEventListener('scroll', function() {
        topBtn.classList.toggle('visible', window.scrollY > 400);
      });

      topBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      
      const wechatLink = document.querySelector('.wechat-link');
      const wechatModal = document.getElementById('wechatModal');
      if (wechatLink && wechatModal) {
        wechatLink.addEventListener('click', function(e) {
          e.preventDefault();
          wechatModal.classList.add('show');
        });
        wechatModal.addEventListener('click', function(e) {
          if (e.target === wechatModal) {
            wechatModal.classList.remove('show');
          }
        });
      }

      
      const COLLAPSE_LINES = 20;
      document.querySelectorAll('.single-content .highlight').forEach(function(block) {
        
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';
        block.parentNode.insertBefore(wrapper, block);
        wrapper.appendChild(block);

        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = '复制';
        copyBtn.setAttribute('aria-label', '复制代码');
        wrapper.appendChild(copyBtn);

        copyBtn.addEventListener('click', function() {
          const code = block.querySelector('code');
          const text = code ? code.textContent : block.textContent;
          navigator.clipboard.writeText(text).then(function() {
            copyBtn.textContent = '已复制';
            setTimeout(function() { copyBtn.textContent = '复制'; }, 2000);
          }).catch(function() {
            copyBtn.textContent = '失败';
            setTimeout(function() { copyBtn.textContent = '复制'; }, 2000);
          });
        });

        
        const lines = block.querySelectorAll('.line');
        if (lines.length > COLLAPSE_LINES) {
          wrapper.classList.add('collapsed');
        }
      });

      
      const tocLinks = document.querySelectorAll('.toc a');
      if (tocLinks.length > 0) {
        const headings = document.querySelectorAll('.single-content h2, .single-content h3');
        const observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              tocLinks.forEach(function(link) { link.classList.remove('active'); });
              const id = entry.target.id;
              const activeLink = document.querySelector('.toc a[href="#' + id + '"]');
              if (activeLink) activeLink.classList.add('active');
            }
          });
        }, { rootMargin: '-80px 0px -60% 0px' });
        headings.forEach(function(h) { if (h.id) observer.observe(h); });
      }
    })();
  </script>
